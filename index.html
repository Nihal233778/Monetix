<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Katrin — TMA</title>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js?56">
    </script>
    <style>
        /* ── Reset & Base ── */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --tg-bg: var(--tg-theme-bg-color, #0a0a0f);
            --tg-text: var(--tg-theme-text-color, #ffffff);
            --tg-hint: var(--tg-theme-hint-color, #8888aa);
            --tg-link: var(--tg-theme-link-color, #6c8cff);
            --tg-button: var(--tg-theme-button-color, #6c8cff);
            --tg-button-text: var(--tg-theme-button-text-color, #ffffff);
            --tg-secondary-bg: var(--tg-theme-secondary-bg-color, #1a1a2e);
            --tg-section-bg: var(--tg-theme-section-bg-color, #12121f);

            --card-bg: rgba(255, 255, 255, 0.05);
            --card-border: rgba(255, 255, 255, 0.06);
            --gold: #f7c948;
            --green: #4ade80;
            --blue: #6c8cff;
            --purple: #a78bfa;
            --pink: #f472b6;
            --radius: 20px;
            --radius-sm: 12px;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            --transition: 0.25s cubic-bezier(0.22, 1, 0.36, 1);
            --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        @media (prefers-color-scheme: light) {
            :root {
                --tg-bg: #f5f5fa;
                --tg-text: #1a1a2e;
                --tg-hint: #6b6b8a;
                --tg-secondary-bg: #ececf3;
                --tg-section-bg: #ffffff;
                --card-bg: rgba(0, 0, 0, 0.03);
                --card-border: rgba(0, 0, 0, 0.06);
                --shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
            }
        }

        html,
        body {
            height: 100%;
            font-family: var(--font);
            background: var(--tg-bg);
            color: var(--tg-text);
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* ── App Container ── */
        .app {
            max-width: 430px;
            margin: 0 auto;
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            padding: 16px 16px 0;
            background: var(--tg-bg);
            position: relative;
            overflow: hidden;
        }

        /* ── Status Bar (mock) ── */
        .status-bar {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            font-weight: 600;
            color: var(--tg-hint);
            padding: 4px 4px 12px;
            letter-spacing: 0.3px;
            flex-shrink: 0;
        }

        .status-bar .time {
            color: var(--tg-text);
        }

        /* ── Header ── */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 4px 0 14px;
            flex-shrink: 0;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--blue), var(--purple));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: 700;
            color: #fff;
            flex-shrink: 0;
            box-shadow: 0 4px 16px rgba(108, 140, 255, 0.3);
            position: relative;
        }

        .avatar .level-badge {
            position: absolute;
            bottom: -2px;
            right: -2px;
            background: var(--gold);
            color: #1a1a2e;
            font-size: 9px;
            font-weight: 800;
            padding: 1px 6px;
            border-radius: 10px;
            border: 2px solid var(--tg-bg);
            line-height: 1.4;
        }

        .user-info {
            display: flex;
            flex-direction: column;
        }

        .user-info .name {
            font-size: 17px;
            font-weight: 700;
            color: var(--tg-text);
            line-height: 1.2;
        }

        .user-info .level {
            font-size: 12px;
            color: var(--tg-hint);
            font-weight: 500;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .header-right .icon-btn {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: var(--tg-text);
            transition: background var(--transition), transform var(--transition);
            cursor: default;
        }

        .header-right .icon-btn:active {
            transform: scale(0.92);
            background: rgba(255, 255, 255, 0.08);
        }

        /* ── Airdrop Row ── */
        .airdrop-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-sm);
            padding: 10px 16px;
            margin-bottom: 14px;
            flex-shrink: 0;
        }

        .airdrop-row .label {
            font-size: 14px;
            font-weight: 600;
            color: var(--tg-hint);
        }

        .airdrop-row .label span {
            color: var(--gold);
        }

        .airdrop-row .rank {
            font-size: 13px;
            color: var(--tg-hint);
            background: var(--tg-secondary-bg);
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: 500;
        }

        .airdrop-row .rank strong {
            color: var(--tg-text);
        }

        /* ── Daily Task Card ── */
        .daily-task {
            background: linear-gradient(135deg, rgba(108, 140, 255, 0.08), rgba(167, 139, 250, 0.08));
            border: 1px solid var(--card-border);
            border-radius: var(--radius);
            padding: 16px 18px;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }

        .daily-task .task-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .daily-task .task-icon {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--gold), #f59e0b);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
        }

        .daily-task .task-info .task-title {
            font-size: 15px;
            font-weight: 600;
            color: var(--tg-text);
        }

        .daily-task .task-info .task-sub {
            font-size: 12px;
            color: var(--tg-hint);
        }

        .daily-task .task-reward {
            font-size: 16px;
            font-weight: 700;
            color: var(--gold);
            background: rgba(247, 201, 72, 0.12);
            padding: 6px 14px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .daily-task .task-reward small {
            font-size: 11px;
            font-weight: 500;
            color: var(--tg-hint);
        }

        /* ── Victory & Gift Box ── */
        .victory-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 14px;
            flex-shrink: 0;
        }

        .victory-box {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-sm);
            padding: 12px 14px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .victory-box .v-icon {
            font-size: 28px;
            flex-shrink: 0;
        }

        .victory-box .v-info .v-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--tg-text);
        }

        .victory-box .v-info .v-time {
            font-size: 12px;
            color: var(--tg-hint);
            font-weight: 500;
        }

        .victory-box .v-info .v-time strong {
            color: var(--gold);
        }

        .victory-box .v-badge {
            margin-left: auto;
            background: rgba(247, 201, 72, 0.15);
            color: var(--gold);
            font-size: 11px;
            font-weight: 700;
            padding: 2px 10px;
            border-radius: 12px;
        }

        /* ── +3 Buttons ── */
        .plus-row {
            display: flex;
            gap: 12px;
            margin-bottom: 14px;
            flex-shrink: 0;
        }

        .plus-btn {
            flex: 1;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-sm);
            padding: 12px 0;
            text-align: center;
            font-size: 22px;
            font-weight: 700;
            color: var(--green);
            transition: background var(--transition), transform var(--transition);
            cursor: default;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .plus-btn:active {
            transform: scale(0.96);
            background: rgba(74, 222, 128, 0.06);
        }

        .plus-btn span {
            font-size: 13px;
            font-weight: 600;
            color: var(--tg-hint);
        }

        /* ── Challenge ── */
        .challenge-box {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-sm);
            padding: 14px 16px;
            margin-bottom: 14px;
            flex-shrink: 0;
        }

        .challenge-box .challenge-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .challenge-box .challenge-header .ch-label {
            font-size: 14px;
            font-weight: 600;
            color: var(--tg-text);
        }

        .challenge-box .challenge-header .ch-progress-text {
            font-size: 13px;
            font-weight: 600;
            color: var(--tg-hint);
        }

        .challenge-box .challenge-header .ch-progress-text strong {
            color: var(--blue);
        }

        .challenge-bar {
            width: 100%;
            height: 6px;
            background: var(--tg-secondary-bg);
            border-radius: 4px;
            overflow: hidden;
            margin-top: 4px;
        }

        .challenge-bar .fill {
            height: 100%;
            width: 44%;
            background: linear-gradient(90deg, var(--blue), var(--purple));
            border-radius: 4px;
            transition: width 0.6s ease;
        }

        .challenge-box .challenge-action {
            margin-top: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .challenge-box .challenge-action .ch-btn {
            background: var(--blue);
            color: #fff;
            border: none;
            padding: 8px 24px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 600;
            font-family: var(--font);
            cursor: default;
            transition: transform var(--transition), box-shadow var(--transition);
            box-shadow: 0 4px 16px rgba(108, 140, 255, 0.25);
        }

        .challenge-box .challenge-action .ch-btn:active {
            transform: scale(0.95);
        }

        .challenge-box .challenge-action .ch-reward {
            font-size: 14px;
            color: var(--tg-hint);
        }

        .challenge-box .challenge-action .ch-reward strong {
            color: var(--gold);
        }

        /* ── Navigation ── */
        .nav {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 4px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius);
            padding: 6px 4px;
            margin-top: auto;
            margin-bottom: 12px;
            flex-shrink: 0;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 8px 0 6px;
            border-radius: var(--radius-sm);
            transition: background var(--transition);
            cursor: default;
            color: var(--tg-hint);
            gap: 2px;
        }

        .nav-item .nav-icon {
            font-size: 22px;
            line-height: 1;
        }

        .nav-item .nav-label {
            font-size: 10px;
            font-weight: 500;
            letter-spacing: 0.2px;
        }

        .nav-item.active {
            color: var(--tg-text);
            background: rgba(108, 140, 255, 0.08);
        }

        .nav-item.active .nav-label {
            color: var(--blue);
            font-weight: 600;
        }

        .nav-item:active {
            transform: scale(0.94);
        }

        /* ── Scrollable content area ── */
        .scroll-area {
            flex: 1;
            overflow-y: auto;
            padding-right: 2px;
            margin-bottom: 4px;
            display: flex;
            flex-direction: column;
            -webkit-overflow-scrolling: touch;
        }

        .scroll-area::-webkit-scrollbar {
            width: 3px;
        }

        .scroll-area::-webkit-scrollbar-track {
            background: transparent;
        }

        .scroll-area::-webkit-scrollbar-thumb {
            background: var(--tg-hint);
            border-radius: 8px;
        }

        /* ── Responsive tweaks ── */
        @media (max-width: 400px) {
            .app {
                padding: 12px 12px 0;
            }
            .daily-task .task-reward {
                font-size: 13px;
                padding: 4px 10px;
            }
            .victory-box .v-icon {
                font-size: 22px;
            }
            .plus-btn {
                font-size: 18px;
                padding: 10px 0;
            }
            .header .avatar {
                width: 40px;
                height: 40px;
                font-size: 16px;
            }
            .user-info .name {
                font-size: 15px;
            }
        }

        @media (max-width: 360px) {
            .victory-row {
                grid-template-columns: 1fr;
            }
            .airdrop-row {
                flex-wrap: wrap;
                gap: 6px;
            }
            .challenge-box .challenge-action {
                flex-wrap: wrap;
                gap: 8px;
            }
        }

        /* ── Animations ── */
        @keyframes pulse-glow {
            0%,
            100% {
                box-shadow: 0 0 0 0 rgba(247, 201, 72, 0.2);
            }
            50% {
                box-shadow: 0 0 20px 4px rgba(247, 201, 72, 0.1);
            }
        }

        .gift-pulse {
            animation: pulse-glow 2.5s infinite;
        }

        /* ── Close button (X) ── */
        .close-btn {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 50%;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            color: var(--tg-hint);
            transition: background var(--transition), transform var(--transition);
            cursor: default;
            flex-shrink: 0;
        }

        .close-btn:active {
            transform: scale(0.88);
            background: rgba(255, 255, 255, 0.06);
        }

        .header-right .close-btn {
            margin-left: 4px;
        }
    </style>
</head>
<body>

    <div class="app" id="app">

        <!-- ─── Status Bar ─── -->
        <div class="status-bar">
            <span class="time">8:00</span>
            <span>📶 🔋</span>
        </div>

        <!-- ─── Header ─── -->
        <header class="header">
            <div class="header-left">
                <div class="avatar">
                    K
                    <span class="level-badge">17</span>
                </div>
                <div class="user-info">
                    <span class="name">Katrin Elsmann</span>
                    <span class="level">Level 17</span>
                </div>
            </div>
            <div class="header-right">
                <div class="icon-btn" role="button">🏆</div>
                <div class="close-btn" role="button" id="closeBtn">✕</div>
            </div>
        </header>

        <!-- ─── Scrollable Area ─── -->
        <div class="scroll-area">

            <!-- Airdrop -->
            <div class="airdrop-row">
                <span class="label">Airdrop <span>▼</span></span>
                <span class="rank">Your rank No: <strong>25 383</strong></span>
            </div>

            <!-- Daily Task -->
            <div class="daily-task">
                <div class="task-left">
                    <div class="task-icon">📋</div>
                    <div class="task-info">
                        <div class="task-title">Daily task</div>
                        <div class="task-sub">Complete &amp; claim</div>
                    </div>
                </div>
                <div class="task-reward">
                    +25245 <small>pts</small>
                </div>
            </div>

            <!-- Victory + Gift Box -->
            <div class="victory-row">
                <div class="victory-box">
                    <span class="v-icon">🏅</span>
                    <div class="v-info">
                        <div class="v-title">Victory</div>
                        <div class="v-time">🎯 <strong>+3</strong> bonus</div>
                    </div>
                    <span class="v-badge">Win</span>
                </div>
                <div class="victory-box gift-pulse">
                    <span class="v-icon">🎁</span>
                    <div class="v-info">
                        <div class="v-title">Gift Box</div>
                        <div class="v-time">⏳ <strong id="giftTimer">15:26:08</strong></div>
                    </div>
                    <span class="v-badge">Available</span>
                </div>
            </div>

            <!-- +3 Buttons -->
            <div class="plus-row">
                <div class="plus-btn" role="button">+3 <span>claim</span></div>
                <div class="plus-btn" role="button">+3 <span>claim</span></div>
                <div class="plus-btn" role="button">+3 <span>claim</span></div>
            </div>

            <!-- Challenge -->
            <div class="challenge-box">
                <div class="challenge-header">
                    <span class="ch-label">⚡ Challenge up</span>
                    <span class="ch-progress-text"><strong>220</strong> / 500</span>
                </div>
                <div class="challenge-bar">
                    <div class="fill" style="width: 44%;"></div>
                </div>
                <div class="challenge-action">
                    <button class="ch-btn" id="challengeBtn">Challenge</button>
                    <span class="ch-reward">Reward: <strong>+150</strong> pts</span>
                </div>
            </div>

            <!-- spacer for nav -->
            <div style="height: 8px; flex-shrink: 0;"></div>

        </div>

        <!-- ─── Navigation ─── -->
        <nav class="nav">
            <div class="nav-item active">
                <span class="nav-icon">⚔️</span>
                <span class="nav-label">Duel</span>
            </div>
            <div class="nav-item">
                <span class="nav-icon">🔍</span>
                <span class="nav-label">Search</span>
            </div>
            <div class="nav-item">
                <span class="nav-icon">🛍️</span>
                <span class="nav-label">Shop</span>
            </div>
            <div class="nav-item">
                <span class="nav-icon">👥</span>
                <span class="nav-label">Friends</span>
            </div>
            <div class="nav-item">
                <span class="nav-icon">🏠</span>
                <span class="nav-label">Home</span>
            </div>
        </nav>

    </div>

    <script>
        (function() {
            'use strict';

            // ─── Telegram WebApp ───
            const tg = window.Telegram?.WebApp;
            if (tg) {
                tg.ready();
                tg.expand();
            }

            // ─── Close button ───
            const closeBtn = document.getElementById('closeBtn');
            if (closeBtn) {
                closeBtn.addEventListener('click', () => {
                    if (tg) {
                        tg.close();
                    } else {
                        // fallback: go back
                        window.history.back();
                    }
                });
            }

            // ─── Gift timer countdown (mock) ───
            const timerEl = document.getElementById('giftTimer');
            if (timerEl) {
                let totalSeconds = 15 * 3600 + 26 * 60 + 8; // 15:26:08

                function updateTimer() {
                    if (totalSeconds <= 0) {
                        timerEl.textContent = '00:00:00';
                        return;
                    }
                    const h = String(Math.floor(totalSeconds / 3600)).padStart(2, '0');
                    const m = String(Math.floor((totalSeconds % 3600) / 60)).padStart(2, '0');
                    const s = String(totalSeconds % 60).padStart(2, '0');
                    timerEl.textContent = `${h}:${m}:${s}`;
                    totalSeconds--;
                }

                updateTimer();
                setInterval(updateTimer, 1000);
            }

            // ─── Challenge button ───
            const challengeBtn = document.getElementById('challengeBtn');
            const fillBar = document.querySelector('.challenge-bar .fill');
            const progressText = document.querySelector('.challenge-header .ch-progress-text');

            if (challengeBtn && fillBar && progressText) {
                let currentProgress = 220;
                const maxProgress = 500;

                challengeBtn.addEventListener('click', function(e) {
                    // Haptic feedback (if available)
                    if (tg && tg.HapticFeedback) {
                        tg.HapticFeedback.impactOccurred('medium');
                    }

                    // Increase progress by random 10-25
                    const increment = Math.floor(Math.random() * 16) + 10;
                    currentProgress = Math.min(currentProgress + increment, maxProgress);
                    const percent = (currentProgress / maxProgress) * 100;

                    fillBar.style.width = percent + '%';
                    progressText.innerHTML = `<strong>${currentProgress}</strong> / ${maxProgress}`;

                    // Button feedback
                    challengeBtn.style.transform = 'scale(0.92)';
                    setTimeout(() => {
                        challengeBtn.style.transform = '';
                    }, 150);

                    // If completed, show message
                    if (currentProgress >= maxProgress) {
                        challengeBtn.textContent = '✅ Done!';
                        challengeBtn.style.background = '#4ade80';
                        challengeBtn.style.boxShadow = '0 4px 16px rgba(74, 222, 128, 0.3)';
                        setTimeout(() => {
                            challengeBtn.textContent = 'Challenge';
                            challengeBtn.style.background = '';
                            challengeBtn.style.boxShadow = '';
                            currentProgress = 0;
                            fillBar.style.width = '0%';
                            progressText.innerHTML = `<strong>0</strong> / ${maxProgress}`;
                        }, 2000);
                    }
                });
            }

            // ─── +3 buttons ───
            document.querySelectorAll('.plus-btn').forEach((btn) => {
                btn.addEventListener('click', function() {
                    if (tg && tg.HapticFeedback) {
                        tg.HapticFeedback.impactOccurred('light');
                    }
                    // Visual feedback
                    this.style.transform = 'scale(0.92)';
                    this.style.background = 'rgba(74, 222, 128, 0.12)';
                    setTimeout(() => {
                        this.style.transform = '';
                        this.style.background = '';
                    }, 200);

                    // Update daily task reward (mock)
                    const taskReward = document.querySelector('.daily-task .task-reward');
                    if (taskReward) {
                        const current = parseInt(taskReward.textContent.replace(/[^0-9]/g, '')) || 25245;
                        const newVal = current + 3;
                        taskReward.innerHTML = `+${newVal.toLocaleString()} <small>pts</small>`;
                    }
                });
            });

            // ─── Nav items (active state) ───
            document.querySelectorAll('.nav-item').forEach((item) => {
                item.addEventListener('click', function() {
                    document.querySelectorAll('.nav-item').forEach((el) => el.classList.remove('active'));
                    this.classList.add('active');
                    if (tg && tg.HapticFeedback) {
                        tg.HapticFeedback.selectionChanged();
                    }
                });
            });

            // ─── Victory box click ───
            document.querySelectorAll('.victory-box').forEach((box) => {
                box.addEventListener('click', function() {
                    if (tg && tg.HapticFeedback) {
                        tg.HapticFeedback.impactOccurred('soft');
                    }
                    this.style.transform = 'scale(0.96)';
                    setTimeout(() => {
                        this.style.transform = '';
                    }, 150);
                });
            });

            // ─── Avatar click ───
            const avatar = document.querySelector('.avatar');
            if (avatar) {
                avatar.addEventListener('click', () => {
                    if (tg && tg.HapticFeedback) {
                        tg.HapticFeedback.impactOccurred('rigid');
                    }
                    // subtle animation
                    avatar.style.transform = 'scale(0.9)';
                    setTimeout(() => {
                        avatar.style.transform = '';
                    }, 180);
                });
            }

            // ─── Theme sync ───
            if (tg && tg.onEvent) {
                tg.onEvent('themeChanged', () => {
                    document.body.style.background = 'var(--tg-bg)';
                });
            }

            console.log('[Katrin TMA] Ready ✅');
        })();
    </script>

</body>
</html>
