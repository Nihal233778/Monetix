  <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Reward Hub — TMA</title>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js?56">
    </script>
    <!-- Monetix Ads SDK -->
    <script src="https://www.monetixads.online/ads.js" data-mxid="MX-5345E1E9">
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --tg-bg: var(--tg-theme-bg-color, #0f0f1a);
            --tg-text: var(--tg-theme-text-color, #ffffff);
            --tg-hint: var(--tg-theme-hint-color, #8888aa);
            --tg-button: var(--tg-theme-button-color, #6c8cff);
            --tg-button-text: var(--tg-theme-button-text-color, #ffffff);
            --tg-secondary-bg: var(--tg-theme-secondary-bg-color, #1a1a2e);
            --radius: 16px;
            --radius-sm: 10px;
            --shadow: 0 4px 24px rgba(0, 0, 0, 0.3);
            --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            --gold: #f7c948;
            --green: #4ade80;
            --blue: #6c8cff;
            --purple: #a78bfa;
            --pink: #f472b6;
        }

        @media (prefers-color-scheme: light) {
            :root {
                --tg-bg: #f5f5fa;
                --tg-text: #1a1a2e;
                --tg-hint: #6b6b8a;
                --tg-secondary-bg: #ececf3;
                --shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
            }
        }

        html,
        body {
            height: 100%;
            font-family: var(--font);
            background: var(--tg-bg);
            color: var(--tg-text);
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        .app {
            max-width: 420px;
            margin: 0 auto;
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            padding: 16px 16px 12px;
            background: var(--tg-bg);
            overflow: hidden;
        }

        /* ─── Header ─── */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 4px 0 16px;
            flex-shrink: 0;
        }

        .header h1 {
            font-size: 22px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--blue), var(--purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header .status {
            font-size: 12px;
            font-weight: 600;
            color: var(--tg-hint);
            background: var(--tg-secondary-bg);
            padding: 4px 14px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .header .status .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #4ade80;
            display: inline-block;
            animation: pulse-dot 1.8s infinite;
        }

        @keyframes pulse-dot {
            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.4;
                transform: scale(0.8);
            }
        }

        /* ─── Balance Card ─── */
        .balance-card {
            background: linear-gradient(135deg, rgba(108, 140, 255, 0.12), rgba(167, 139, 250, 0.08));
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: var(--radius);
            padding: 18px 20px;
            margin-bottom: 18px;
            flex-shrink: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .balance-card .label {
            font-size: 13px;
            color: var(--tg-hint);
            font-weight: 500;
        }

        .balance-card .points {
            font-size: 28px;
            font-weight: 700;
            color: var(--gold);
        }

        .balance-card .points small {
            font-size: 14px;
            font-weight: 500;
            color: var(--tg-hint);
        }

        /* ─── Scroll Area ─── */
        .scroll-area {
            flex: 1;
            overflow-y: auto;
            padding-right: 2px;
            -webkit-overflow-scrolling: touch;
        }

        .scroll-area::-webkit-scrollbar {
            width: 3px;
        }
        .scroll-area::-webkit-scrollbar-track {
            background: transparent;
        }
        .scroll-area::-webkit-scrollbar-thumb {
            background: var(--tg-hint);
            border-radius: 8px;
        }

        /* ─── Reward Grid ─── */
        .section-title {
            font-size: 15px;
            font-weight: 600;
            color: var(--tg-text);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .reward-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 18px;
        }

        .reward-card {
            background: var(--tg-secondary-bg);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: var(--radius-sm);
            padding: 16px 14px;
            text-align: center;
            cursor: default;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            user-select: none;
            position: relative;
        }

        .reward-card:active {
            transform: scale(0.96);
        }

        .reward-card .icon {
            font-size: 32px;
            margin-bottom: 6px;
            display: block;
        }

        .reward-card .name {
            font-size: 14px;
            font-weight: 600;
            color: var(--tg-text);
        }

        .reward-card .reward-amount {
            font-size: 16px;
            font-weight: 700;
            color: var(--gold);
            margin-top: 4px;
        }

        .reward-card .reward-amount small {
            font-size: 11px;
            font-weight: 400;
            color: var(--tg-hint);
        }

        .reward-card .badge {
            position: absolute;
            top: 8px;
            right: 8px;
            font-size: 9px;
            font-weight: 700;
            text-transform: uppercase;
            padding: 2px 10px;
            border-radius: 12px;
            background: rgba(74, 222, 128, 0.15);
            color: var(--green);
        }

        .reward-card .badge.claimed {
            background: rgba(255, 255, 255, 0.05);
            color: var(--tg-hint);
        }

        .reward-card .badge.ad {
            background: rgba(108, 140, 255, 0.15);
            color: var(--blue);
        }

        .reward-card .sub-text {
            font-size: 11px;
            color: var(--tg-hint);
            margin-top: 4px;
        }

        /* ─── Challenge ─── */
        .challenge-box {
            background: var(--tg-secondary-bg);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: var(--radius-sm);
            padding: 16px 18px;
            margin-bottom: 18px;
        }

        .challenge-box .ch-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .challenge-box .ch-header .ch-label {
            font-size: 14px;
            font-weight: 600;
            color: var(--tg-text);
        }

        .challenge-box .ch-header .ch-progress {
            font-size: 13px;
            font-weight: 600;
            color: var(--tg-hint);
        }

        .challenge-box .ch-header .ch-progress strong {
            color: var(--blue);
        }

        .challenge-box .ch-bar {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 4px;
            overflow: hidden;
        }

        .challenge-box .ch-bar .fill {
            height: 100%;
            width: 44%;
            background: linear-gradient(90deg, var(--blue), var(--purple));
            border-radius: 4px;
            transition: width 0.5s ease;
        }

        .challenge-box .ch-action {
            margin-top: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .challenge-box .ch-action .ch-btn {
            background: var(--blue);
            color: #fff;
            border: none;
            padding: 8px 28px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 600;
            font-family: var(--font);
            cursor: default;
            transition: transform 0.15s ease, opacity 0.2s ease;
            box-shadow: 0 4px 16px rgba(108, 140, 255, 0.25);
        }

        .challenge-box .ch-action .ch-btn:active {
            transform: scale(0.94);
        }

        .challenge-box .ch-action .ch-btn:disabled {
            opacity: 0.6;
            pointer-events: none;
        }

        .challenge-box .ch-action .ch-reward {
            font-size: 13px;
            color: var(--tg-hint);
        }

        .challenge-box .ch-action .ch-reward strong {
            color: var(--gold);
        }

        /* ─── Nav ─── */
        .nav {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 4px;
            background: var(--tg-secondary-bg);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: var(--radius);
            padding: 6px 4px;
            margin-top: auto;
            flex-shrink: 0;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 8px 0 6px;
            border-radius: var(--radius-sm);
            transition: background 0.15s ease;
            cursor: default;
            color: var(--tg-hint);
            gap: 2px;
            user-select: none;
        }

        .nav-item:active {
            transform: scale(0.92);
        }

        .nav-item .nav-icon {
            font-size: 20px;
            line-height: 1;
        }

        .nav-item .nav-label {
            font-size: 9px;
            font-weight: 500;
            letter-spacing: 0.2px;
        }

        .nav-item.active {
            color: var(--tg-text);
            background: rgba(108, 140, 255, 0.08);
        }

        .nav-item.active .nav-label {
            color: var(--blue);
            font-weight: 600;
        }

        /* ─── Toast ─── */
        .toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: var(--tg-text);
            color: var(--tg-bg);
            padding: 10px 24px;
            border-radius: var(--radius-sm);
            font-size: 13px;
            font-weight: 600;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            opacity: 0;
            transition: opacity 0.3s ease, transform 0.3s ease;
            pointer-events: none;
            z-index: 999;
            max-width: 88%;
            text-align: center;
            font-family: var(--font);
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .toast.success {
            background: #4ade80;
            color: #0a0a0f;
        }

        .toast.error {
            background: #ef4444;
            color: #fff;
        }

        .toast.warning {
            background: #f59e0b;
            color: #0a0a0f;
        }

        .toast.info {
            background: var(--blue);
            color: #fff;
        }

        /* ─── Close btn ─── */
        .close-btn {
            background: var(--tg-secondary-bg);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 50%;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            color: var(--tg-hint);
            transition: background 0.15s ease, transform 0.15s ease;
            cursor: default;
            flex-shrink: 0;
        }

        .close-btn:active {
            transform: scale(0.88);
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* ─── Responsive ─── */
        @media (max-width: 380px) {
            .reward-grid {
                grid-template-columns: 1fr 1fr;
                gap: 8px;
            }
            .reward-card {
                padding: 12px 10px;
            }
            .reward-card .icon {
                font-size: 26px;
            }
            .balance-card .points {
                font-size: 22px;
            }
        }

        @keyframes reward-flash {
            0% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.15);
                color: #4ade80;
            }
            100% {
                transform: scale(1);
            }
        }

        .reward-flash {
            animation: reward-flash 0.5s ease;
        }
    </style>
</head>
<body>

    <div class="app">

        <!-- ─── Header ─── -->
        <header class="header">
            <h1>⭐ Reward Hub</h1>
            <div class="header-right">
                <span class="status"><span class="dot"></span> Live</span>
                <div class="close-btn" id="closeBtn">✕</div>
            </div>
        </header>

        <!-- ─── Balance ─── -->
        <div class="balance-card">
            <span class="label">💰 Total Points</span>
            <span class="points" id="totalPoints">25,245 <small>pts</small></span>
        </div>

        <!-- ─── Scroll Area ─── -->
        <div class="scroll-area">

            <div class="section-title">🎯 Watch & Earn</div>

            <div class="reward-grid">

                <!-- Daily Task -->
                <div class="reward-card" data-reward="daily">
                    <span class="icon">📋</span>
                    <span class="name">Daily Task</span>
                    <span class="reward-amount" id="dailyAmount">+100-500</span>
                    <span class="badge ad">AD</span>
                    <div class="sub-text" id="dailySub">Tap to watch</div>
                </div>

                <!-- Gift Box -->
                <div class="reward-card" data-reward="gift">
                    <span class="icon">🎁</span>
                    <span class="name">Gift Box</span>
                    <span class="reward-amount">+200-800</span>
                    <span class="badge ad">AD</span>
                    <div class="sub-text" id="giftSub">Tap to open</div>
                </div>

                <!-- Victory -->
                <div class="reward-card" data-reward="victory">
                    <span class="icon">🏅</span>
                    <span class="name">Victory</span>
                    <span class="reward-amount">+3</span>
                    <span class="badge ad">AD</span>
                    <div class="sub-text" id="victorySub">Tap to claim</div>
                </div>

                <!-- Bonus -->
                <div class="reward-card" data-reward="bonus">
                    <span class="icon">⚡</span>
                    <span class="name">Bonus</span>
                    <span class="reward-amount">+5</span>
                    <span class="badge ad">AD</span>
                    <div class="sub-text" id="bonusSub">Tap to claim</div>
                </div>

            </div>

            <!-- ─── Challenge ─── -->
            <div class="section-title">🏆 Challenge</div>

            <div class="challenge-box">
                <div class="ch-header">
                    <span class="ch-label">⚡ Progress</span>
                    <span class="ch-progress" id="challengeProgress"><strong>220</strong> / 500</span>
                </div>
                <div class="ch-bar">
                    <div class="fill" id="challengeFill" style="width: 44%;"></div>
                </div>
                <div class="ch-action">
                    <button class="ch-btn" id="challengeBtn">🚀 Boost</button>
                    <span class="ch-reward">Reward: <strong>+150</strong> pts</span>
                </div>
            </div>

            <div style="height: 8px;"></div>

        </div>

        <!-- ─── Nav ─── -->
        <nav class="nav">
            <div class="nav-item active">
                <span class="nav-icon">🏠</span>
                <span class="nav-label">Home</span>
            </div>
            <div class="nav-item">
                <span class="nav-icon">⚔️</span>
                <span class="nav-label">Duel</span>
            </div>
            <div class="nav-item">
                <span class="nav-icon">🛍️</span>
                <span class="nav-label">Shop</span>
            </div>
            <div class="nav-item">
                <span class="nav-icon">👥</span>
                <span class="nav-label">Friends</span>
            </div>
            <div class="nav-item">
                <span class="nav-icon">⚙️</span>
                <span class="nav-label">Settings</span>
            </div>
        </nav>

        <!-- ─── Toast ─── -->
        <div class="toast" id="toast"></div>

    </div>

    <script>
        (function() {
            'use strict';

            // ─── Telegram ───
            const tg = window.Telegram?.WebApp;
            if (tg) {
                tg.ready();
                tg.expand();
                console.log('[Telegram] ✅ Ready');
            }

            // ─── Close ───
            document.getElementById('closeBtn').addEventListener('click', () => {
                if (tg) tg.close();
                else window.history.back();
            });

            // ─── Toast ───
            const toastEl = document.getElementById('toast');
            let toastTimer = null;

            function showToast(msg, type = 'success') {
                if (toastTimer) clearTimeout(toastTimer);
                toastEl.textContent = msg;
                toastEl.className = 'toast ' + type;
                void toastEl.offsetWidth;
                toastEl.classList.add('show');
                toastTimer = setTimeout(() => {
                    toastEl.classList.remove('show');
                    toastTimer = null;
                }, 3000);
            }

            // ─── DOM ───
            const totalPointsEl = document.getElementById('totalPoints');
            const dailyAmount = document.getElementById('dailyAmount');
            const dailySub = document.getElementById('dailySub');
            const giftSub = document.getElementById('giftSub');
            const victorySub = document.getElementById('victorySub');
            const bonusSub = document.getElementById('bonusSub');
            const challengeFill = document.getElementById('challengeFill');
            const challengeProgress = document.getElementById('challengeProgress');
            const challengeBtn = document.getElementById('challengeBtn');

            let points = 25245;
            let dailyClaimed = false;
            let giftClaimed = false;
            let victoryClaimed = false;
            let bonusClaimed = false;
            let challengeProgressVal = 220;
            const challengeMax = 500;
            let challengeInProgress = false;

            // ─── Update Points ───
            function updatePoints(amount) {
                points += amount;
                totalPointsEl.innerHTML = `${points.toLocaleString()} <small>pts</small>`;
                totalPointsEl.classList.add('reward-flash');
                setTimeout(() => totalPointsEl.classList.remove('reward-flash'), 500);
            }

            // ─── Monetix Ad ───
            function showAd(onComplete, onError) {
                console.log('[Monetix] 🎬 Showing ad...');

                if (typeof window.showRewardAd !== 'function') {
                    console.warn('[Monetix] ⚠️ SDK not loaded');
                    showToast('⚠️ Ad SDK loading... Please wait.', 'warning');
                    // Try again in 1.5s
                    setTimeout(() => {
                        if (typeof window.showRewardAd === 'function') {
                            showAd(onComplete, onError);
                        } else {
                            showToast('❌ Ad SDK unavailable. Try again.', 'error');
                            if (onError) onError('sdk_unavailable');
                        }
                    }, 1500);
                    return;
                }

                try {
                    window.showRewardAd(function(res) {
                        console.log('[Monetix] 📦 Response:', res);

                        const status = res?.status || res?.state || res?.result || 'unknown';
                        console.log('[Monetix] 📊 Status:', status);

                        const success = ['completed', 'closed', 'finished', 'done', 'success', 'rewarded', 'viewed',
                            'shown', 'watched'
                        ];
                        const ok = success.includes(status.toLowerCase());

                        if (ok) {
                            console.log('[Monetix] ✅ Success!');
                            showToast('✅ Ad completed! Reward granted!', 'success');
                            if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
                            if (onComplete) onComplete();
                        } else {
                            console.log('[Monetix] ❌ Failed:', status);
                            showToast(`Ad ${status}. Try again.`, 'error');
                            if (onError) onError(status);
                        }
                    });
                } catch (err) {
                    console.error('[Monetix] 💥 Error:', err);
                    showToast('⚠️ Ad error. Try again.', 'error');
                    if (onError) onError('error');
                }
            }

            // ─── Reward Helpers ───
            function getRandom(min, max) {
                return Math.floor(Math.random() * (max - min + 1)) + min;
            }

            // ─── Daily Task ───
            document.querySelector('[data-reward="daily"]').addEventListener('click', function() {
                if (dailyClaimed) {
                    showToast('✅ Already claimed today!', 'warning');
                    return;
                }
                if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('light');

                showAd(
                    function() {
                        const bonus = getRandom(100, 500);
                        dailyClaimed = true;
                        dailyAmount.textContent = `+${bonus}`;
                        dailySub.textContent = '✅ Claimed!';
                        this.querySelector('.badge').textContent = 'CLAIMED';
                        this.querySelector('.badge').className = 'badge claimed';
                        updatePoints(bonus);
                        showToast(`🎉 +${bonus} points!`, 'success');
                    }.bind(this),
                    function(status) {
                        console.log('[Monetix] Daily ad failed:', status);
                    }
                );
            });

            // ─── Gift Box ───
            document.querySelector('[data-reward="gift"]').addEventListener('click', function() {
                if (giftClaimed) {
                    showToast('🎁 Already opened!', 'warning');
                    return;
                }
                if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('light');

                showAd(
                    function() {
                        const bonus = getRandom(200, 800);
                        giftClaimed = true;
                        giftSub.textContent = '✅ Opened!';
                        this.querySelector('.badge').textContent = 'OPENED';
                        this.querySelector('.badge').className = 'badge claimed';
                        updatePoints(bonus);
                        showToast(`🎁 +${bonus} points!`, 'success');
                    }.bind(this),
                    function(status) {
                        console.log('[Monetix] Gift ad failed:', status);
                    }
                );
            });

            // ─── Victory ───
            document.querySelector('[data-reward="victory"]').addEventListener('click', function() {
                if (victoryClaimed) {
                    showToast('🏅 Already claimed!', 'warning');
                    return;
                }
                if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('light');

                showAd(
                    function() {
                        victoryClaimed = true;
                        victorySub.textContent = '✅ Claimed!';
                        this.querySelector('.badge').textContent = 'CLAIMED';
                        this.querySelector('.badge').className = 'badge claimed';
                        updatePoints(3);
                        showToast('🏅 +3 victory points!', 'success');
                    }.bind(this),
                    function(status) {
                        console.log('[Monetix] Victory ad failed:', status);
                    }
                );
            });

            // ─── Bonus ───
            document.querySelector('[data-reward="bonus"]').addEventListener('click', function() {
                if (bonusClaimed) {
                    showToast('⚡ Already claimed!', 'warning');
                    return;
                }
                if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('light');

                showAd(
                    function() {
                        bonusClaimed = true;
                        bonusSub.textContent = '✅ Claimed!';
                        this.querySelector('.badge').textContent = 'CLAIMED';
                        this.querySelector('.badge').className = 'badge claimed';
                        updatePoints(5);
                        showToast('⚡ +5 bonus points!', 'success');
                    }.bind(this),
                    function(status) {
                        console.log('[Monetix] Bonus ad failed:', status);
                    }
                );
            });

            // ─── Challenge ───
            challengeBtn.addEventListener('click', function() {
                if (challengeInProgress) return;
                if (challengeProgressVal >= challengeMax) {
                    showToast('🎉 Challenge complete!', 'warning');
                    return;
                }
                if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');

                challengeInProgress = true;
                this.textContent = '⏳ Loading...';
                this.disabled = true;

                showAd(
                    function() {
                        const inc = getRandom(10, 25);
                        challengeProgressVal = Math.min(challengeProgressVal + inc, challengeMax);
                        const pct = (challengeProgressVal / challengeMax) * 100;
                        challengeFill.style.width = pct + '%';
                        challengeProgress.innerHTML = `<strong>${challengeProgressVal}</strong> / ${challengeMax}`;

                        this.textContent = '✅ +' + inc;
                        this.style.background = '#4ade80';
                        this.style.boxShadow = '0 4px 16px rgba(74, 222, 128, 0.3)';

                        showToast(`⚡ +${inc} progress!`, 'success');
                        if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');

                        setTimeout(() => {
                            this.textContent = '🚀 Boost';
                            this.style.background = '';
                            this.style.boxShadow = '';
                            this.disabled = false;
                            challengeInProgress = false;
                        }, 1200);

                        // Challenge complete
                        if (challengeProgressVal >= challengeMax) {
                            setTimeout(() => {
                                this.textContent = '✅ Done!';
                                this.style.background = '#4ade80';
                                this.style.boxShadow = '0 4px 16px rgba(74, 222, 128, 0.4)';
                                showToast('🎉 Challenge complete! +150 pts!', 'success');
                                updatePoints(150);
                                setTimeout(() => {
                                    this.textContent = '🚀 Boost';
                                    this.style.background = '';
                                    this.style.boxShadow = '';
                                    this.disabled = false;
                                    challengeInProgress = false;
                                    challengeProgressVal = 0;
                                    challengeFill.style.width = '0%';
                                    challengeProgress.innerHTML =
                                        `<strong>0</strong> / ${challengeMax}`;
                                }, 3000);
                            }, 500);
                        }
                    }.bind(this),
                    function(status) {
                        this.textContent = '🚀 Boost';
                        this.disabled = false;
                        challengeInProgress = false;
                        console.log('[Monetix] Challenge ad failed:', status);
                    }.bind(this)
                );
            });

            // ─── Nav ───
            document.querySelectorAll('.nav-item').forEach((item) => {
                item.addEventListener('click', function() {
                    document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
                    this.classList.add('active');
                    if (tg?.HapticFeedback) tg.HapticFeedback.selectionChanged();
                    const label = this.querySelector('.nav-label')?.textContent || '';
                    showToast(`📍 ${label}`, 'info');
                });
            });

            // ─── Theme Sync ───
            if (tg?.onEvent) {
                tg.onEvent('themeChanged', () => {
                    document.body.style.background = 'var(--tg-bg)';
                });
            }

            // ─── SDK Check ───
            setTimeout(() => {
                const loaded = typeof window.showRewardAd === 'function';
                console.log('[Monetix] SDK:', loaded ? '✅ Loaded' : '❌ Not loaded');
                if (!loaded) {
                    showToast('⚠️ Ad SDK loading...', 'warning');
                } else {
                    showToast('✅ Ad SDK ready!', 'success');
                }
            }, 2500);

            console.log('[Reward Hub] 🚀 Ready');

        })();
    </script>

</body>
</html>
